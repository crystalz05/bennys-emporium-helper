<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benny's Emporium</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; color: #333; text-align: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 500px; }
        h1 { margin-top: 0; font-size: 2rem; color: #000; }
        p { color: #666; line-height: 1.6; margin-bottom: 24px; }
        .store-badges { display: flex; gap: 10px; justify-content: center; }
        .badge { padding: 12px 24px; background: #000; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
        .badge.outline { background: white; color: #000; border: 2px solid #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Benny's Emporium</h1>
        <p>The Benny's Emporium app provides the best shopping experience right on your phone. Download the app today to get started!</p>
        <div class="store-badges">
            <a href="#" class="badge">Download for iOS</a>
            <a href="#" class="badge outline">Download for Android</a>
        </div>
    </div>
</body>
</html>
