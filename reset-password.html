<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; margin-bottom: 10px; }
        .success { color: green; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p id="message"></p>
        <form id="resetForm">
            <label>New Password</label>
            <input type="password" id="password" required minlength="8">
            
            <label>Confirm Password</label>
            <input type="password" id="password_confirmation" required minlength="8">
            
            <button type="submit">Reset Password</button>
        </form>
    </div>

    <script>
        // UPDATE THIS TO YOUR PRODUCTION BACKEND URL
        const API_BASE_URL = 'https://your-api-url.com/api/v1';

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');
            const msgEl = document.getElementById('message');
            const form = document.getElementById('resetForm');
            
            const password = document.getElementById('password').value;
            const password_confirmation = document.getElementById('password_confirmation').value;

            if (!token || !email) {
                msgEl.textContent = "Invalid password reset link.";
                msgEl.className = "error";
                return;
            }

            msgEl.textContent = "Resetting password...";
            msgEl.className = "";

            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ token, email, password, password_confirmation })
                });

                const data = await response.json();

                if (response.ok) {
                    msgEl.textContent = data.message || "Password successfully reset. You can now log into the app.";
                    msgEl.className = "success";
                    form.style.display = 'none'; // hide form on success
                } else {
                    msgEl.textContent = data.message || "Failed to reset password. Please try again.";
                    msgEl.className = "error";
                }
            } catch (error) {
                msgEl.textContent = "A network error occurred.";
                msgEl.className = "error";
            }
        });
    </script>
</body>
</html>
